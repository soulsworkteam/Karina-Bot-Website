<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Karina Bot</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <div class="logo">Karina Bot</div>
    <div class="header-nav">
      <nav>
        <a href="index.html#home">Home</a>
        <a href="roll.html">Roll</a>
        <a href="index.html#inventory">Inventory</a>
        <a href="private.html" class="requires-auth">Private</a>
      </nav>
      <div class="auth-links">
        <span class="session-indicator" id="sessionIndicator">Not logged in</span>
        <a href="login.html" class="auth-link" data-auth-link="login">Log in</a>
        <a href="signup.html" class="btn primary slim" data-auth-link="signup">Sign up</a>
        <button type="button" class="btn secondary slim" id="logoutBtn">Log out</button>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-card-header">
        <p class="eyebrow">Join Karina Bot</p>
        <h1>Create your collector profile</h1>
        <p>Save your rolls, sync your card vault, and unlock exclusive drops.</p>
      </div>

      <form class="auth-form" data-auth-type="signup">
        <label>
          Username
          <input type="text" name="username" placeholder="karinacollector" required />
        </label>

        <label>
          Date of Birth
          <input type="date" name="dob" required />
        </label>

        <label>
          Password
          <input type="password" name="password" placeholder="Create a password." required />
        </label>

        <button type="submit" class="btn primary full-width">Sign up</button>
        <p class="auth-feedback" role="alert"></p>
      </form>

      <p class="auth-helper">
        Already have an account?
        <a href="login.html">Log in instead</a>
      </p>
    </section>
  </main>

  <footer>
    Karina Bot - Sign Up
  </footer>

  <script src="auth.js"></script>
</body>
</html>
